<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#002333;stop-opacity:1" />
      <stop offset="60%" style="stop-color:#003a52;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#149A9B;stop-opacity:0.3" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#149A9B;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#15949C;stop-opacity:0.6" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="6" dy="6" stdDeviation="12" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)" />

  <!-- Decorative teal circle top-right -->
  <circle cx="1100" cy="80" r="200" fill="#149A9B" opacity="0.08" />
  <circle cx="1050" cy="120" r="120" fill="#149A9B" opacity="0.06" />

  <!-- Decorative circle bottom-left -->
  <circle cx="100" cy="560" r="180" fill="#149A9B" opacity="0.06" />

  <!-- Top accent bar -->
  <rect x="0" y="0" width="1200" height="5" fill="url(#accentGrad)" />

  <!-- Card container -->
  <rect x="64" y="80" width="1072" height="470" rx="24" fill="#002333" opacity="0.7" filter="url(#softShadow)" />

  <!-- Left teal accent stripe -->
  <rect x="64" y="80" width="6" height="470" rx="3" fill="url(#accentGrad)" />

  <!-- Logo area: circle + text -->
  <!-- Teal circle icon -->
  <circle cx="148" cy="200" r="40" fill="#149A9B" filter="url(#glow)" />
  <!-- "O" letter inside circle -->
  <text x="148" y="213" font-family="Inter, Arial, sans-serif" font-size="32" font-weight="700" fill="#ffffff" text-anchor="middle">O</text>

  <!-- OFFER-HUB wordmark -->
  <text x="210" y="215" font-family="Inter, Arial, sans-serif" font-size="48" font-weight="700" fill="#ffffff" letter-spacing="2">OFFER-HUB</text>

  <!-- Teal underline under wordmark -->
  <rect x="210" y="228" width="340" height="3" rx="2" fill="#149A9B" opacity="0.8" />

  <!-- Tagline -->
  <text x="148" y="310" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="400" fill="#F1F3F7" opacity="0.95" letter-spacing="0.5">Secure · Non-Custodial · Escrow Payments</text>

  <!-- Description -->
  <text x="148" y="375" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="400" fill="#6D758F">Empowering marketplaces with self-hosted payment orchestration</text>
  <text x="148" y="405" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="400" fill="#6D758F">built on Stellar and Trustless Work.</text>

  <!-- Feature pills -->
  <rect x="148" y="450" width="160" height="40" rx="20" fill="#149A9B" opacity="0.15" />
  <text x="228" y="475" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="500" fill="#149A9B" text-anchor="middle">Open Source</text>

  <rect x="324" y="450" width="160" height="40" rx="20" fill="#149A9B" opacity="0.15" />
  <text x="404" y="475" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="500" fill="#149A9B" text-anchor="middle">Self-Hosted</text>

  <rect x="500" y="450" width="200" height="40" rx="20" fill="#149A9B" opacity="0.15" />
  <text x="600" y="475" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="500" fill="#149A9B" text-anchor="middle">Provider-Agnostic</text>

  <!-- URL bottom right -->
  <text x="1100" y="510" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="500" fill="#149A9B" text-anchor="end" opacity="0.9">offer-hub.tech</text>

  <!-- Bottom accent bar -->
  <rect x="0" y="625" width="1200" height="5" fill="url(#accentGrad)" />
</svg>
