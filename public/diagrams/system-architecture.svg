<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:xlink="http://www.w3.org/1999/xlink"
     viewBox="0 0 469.00 527.00"
     width="469.00"
     height="527.00"
     role="img"
     aria-label="OfferHub system architecture: client and wallet layers, the NestJS API, the PostgreSQL/Redis data layer, Soroban contracts on Stellar and the BlindPay off-ramp.">
  <!-- dg-source-sha256:8758d0ee209d63d86bb6a678bcd2ac4b5014d29a6a7da39849e2e1a9f5e038c1 -->
  <defs>
    <style>
      --dg-bg: var(--color-background, #f1f3f7);
      --dg-surface: var(--color-surface, #ffffff);
      --dg-surface-alt: var(--color-surface-alt, #e2e8f0);
      --dg-border: var(--color-border, #d1d5db);
      --dg-text: var(--color-text, #19213d);
      --dg-text-muted: var(--color-text-muted, #4b5563);
      --dg-accent: var(--color-accent, #149a9b);
      --dg-accent-contrast: var(--color-accent-contrast, #ffffff);
      --dg-backend: var(--color-secondary, #002333);
      --dg-backend-contrast: #ffffff;
      --dg-shadow-dark: rgba(163, 177, 201, 0.6);
      --dg-shadow-light: rgba(255, 255, 255, 0.9);
      .dg-node polygon,
      .dg-node rect,
      .dg-node ellipse,
      .dg-node path {
        fill: var(--dg-surface);
        stroke: var(--dg-border);
        filter: drop-shadow(2px 2px 4px var(--dg-shadow-dark))
          drop-shadow(-2px -2px 4px var(--dg-shadow-light));
      }

      .dg-node text {
        fill: var(--dg-text);
        font-family: var(--font-sans, Inter, ui-sans-serif, system-ui);
        font-size: 13px;
      }

      .dg-accent polygon,
      .dg-accent rect,
      .dg-accent ellipse,
      .dg-accent path {
        fill: var(--dg-accent);
        stroke: var(--dg-accent);
      }

      .dg-accent text {
        fill: var(--dg-accent-contrast);
      }

      .dg-backend polygon,
      .dg-backend rect,
      .dg-backend ellipse,
      .dg-backend path {
        fill: var(--dg-backend);
        stroke: var(--dg-backend);
      }

      .dg-backend text {
        fill: var(--dg-backend-contrast);
      }

      .dg-edge path {
        stroke: var(--dg-border);
        stroke-width: 1.5;
        fill: none;
      }

      .dg-edge polygon {
        fill: var(--dg-border);
        stroke: var(--dg-border);
      }

      .dg-edge text {
        fill: var(--dg-text-muted);
        font-family: var(--font-sans, Inter, ui-sans-serif, system-ui);
        font-size: 11px;
      }
    </style>
  </defs>
