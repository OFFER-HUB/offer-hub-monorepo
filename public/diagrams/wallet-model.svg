<!DOCTYPE svg  PUBLIC '-//W3C//DTD SVG 1.1//EN'  'http://www.w3.org/Graphics/SVG/1.1/DTD/svg11.dtd'>
<svg width="827pt" height="220pt" viewBox="0 0 827 219.63" xmlns="http://www.w3.org/2000/svg"><style>.oh-node path, .oh-node polygon, .oh-node ellipse {
  fill: var(--color-bg-elevated);
  stroke: var(--color-border);
  stroke-width: 1.5px;
  filter: drop-shadow(3px 3px 4px var(--shadow-dark)) drop-shadow(-2px -2px 4px var(--shadow-light));
}
.oh-node text {
  fill: var(--color-text-primary);
  font-family: var(--font-inter), Inter, sans-serif;
}
.oh-node--terminal ellipse {
  fill: var(--color-primary);
  stroke: var(--color-primary);
  filter: none;
}
.oh-edge path {
  stroke: var(--color-text-secondary);
  fill: none;
}
.oh-edge polygon {
  fill: var(--color-text-secondary);
  stroke: var(--color-text-secondary);
}
.oh-edge--alt path {
  stroke-dasharray: 5 4;
}
.oh-edge--alt polygon {
  stroke-dasharray: none;
}
.oh-cluster path, .oh-cluster polygon {
  fill: none;
  stroke: var(--color-border);
  stroke-width: 1.5px;
  stroke-dasharray: 6 4;
}
.oh-cluster text {
  fill: var(--color-text-secondary);
  font-family: var(--font-inter), Inter, sans-serif;
  font-weight: 600;
}
.oh-edge text {
  fill: var(--color-text-secondary);
  font-family: var(--font-inter), Inter, sans-serif;
}</style><g id="graph0" class="graph" transform="scale(1) translate(4 215.63)"><title>wallet-model</title><g id="clust1" class="cluster oh-cluster"><title>cluster_visible</title><path d="m627-28.63h172c6 0 12-6 12-12v-91c0-6-6-12-12-12h-172c-6 0-12 6-12 12v91c0 6 6 12 12 12" fill="transparent" stroke="black"/><text x="713" y="-130.03" font-family="Inter, sans-serif" font-size="12" text-anchor="middle">What the user sees</text></g><g id="clust2" class="cluster oh-cluster"><title>cluster_hidden</title><path d="m20-22.63h469c6 0 12-6 12-12v-157c0-6-6-12-12-12h-469c-6 0-12 6-12 12v157c0 6 6 12 12 12" fill="transparent" stroke="black"/><text x="254.5" y="-190.03" font-family="Inter, sans-serif" font-size="12" text-anchor="middle">Managed by OFFER-HUB</text></g><g id="node1" class="node oh-node"><title>balance</title><path d="m783-106.63h-140c-6 0-12 6-12 12v38c0 6 6 12 12 12h140c6 0 12-6 12-12v-38c0-6-6-12-12-12" fill="white" stroke="black"/><text x="713" y="-86.23" font-family="Inter, sans-serif" font-size="13" text-anchor="middle">Balance</text><text x="713" y="-72.23" font-family="Inter, sans-serif" font-size="13" text-anchor="middle">available / reserved</text><text x="713" y="-58.23" font-family="Inter, sans-serif" font-size="13" text-anchor="middle">(USD)</text></g><g id="node2" class="node oh-node"><title>wallet</title><path d="m179-101.63h-143c-6 0-12 6-12 12v38c0 6 6 12 12 12h143c6 0 12-6 12-12v-38c0-6-6-12-12-12" fill="white" stroke="black"/><text x="107.5" y="-81.23" font-family="Inter, sans-serif" font-size="13" text-anchor="middle">Wallet record</text><text x="107.5" y="-67.23" font-family="Inter, sans-serif" font-size="13" text-anchor="middle">INVISIBLE / STELLAR</text><text x="107.5" y="-53.23" font-family="Inter, sans-serif" font-size="13" text-anchor="middle">publicKey</text></g><g id="edge1" class="edge oh-edge"><title>balance-&gt;wallet</title><path d="m631.16-44.51c-38.75 13.29-86.19 27.26-130.16 33.88-91.41 13.76-116.7 14.47-208 0-32.57-5.17-67.21-15