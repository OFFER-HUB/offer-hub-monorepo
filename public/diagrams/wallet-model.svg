<!DOCTYPE svg  PUBLIC '-//W3C//DTD SVG 1.1//EN'  'http://www.w3.org/Graphics/SVG/1.1/DTD/svg11.dtd'>
<svg width="823pt" height="234pt" viewBox="0 0 823 234" xmlns="http://www.w3.org/2000/svg"><style>.oh-node path, .oh-node polygon, .oh-node ellipse {
  fill: var(--color-bg-elevated);
  stroke: var(--color-border);
  stroke-width: 1.5px;
  filter: drop-shadow(3px 3px 4px var(--shadow-dark)) drop-shadow(-2px -2px 4px var(--shadow-light));
}
.oh-node text {
  fill: var(--color-text-primary);
  font-family: var(--font-inter), Inter, sans-serif;
}
.oh-node--terminal ellipse {
  fill: var(--color-primary);
  stroke: var(--color-primary);
  filter: none;
}
.oh-edge path {
  stroke: var(--color-text-secondary);
  fill: none;
}
.oh-edge polygon {
  fill: var(--color-text-secondary);
  stroke: var(--color-text-secondary);
}
.oh-edge--alt path {
  stroke-dasharray: 5 4;
}
.oh-edge--alt polygon {
  stroke-dasharray: none;
}
.oh-cluster path, .oh-cluster polygon {
  fill: none;
  stroke: var(--color-border);
  stroke-width: 1.5px;
  stroke-dasharray: 6 4;
}
.oh-cluster text {
  fill: var(--color-text-secondary);
  font-family: var(--font-inter), Inter, sans-serif;
  font-weight: 600;
}
.oh-edge text {
  fill: var(--color-text-secondary);
  font-family: var(--font-inter), Inter, sans-serif;
}</style><g id="graph0" class="graph" transform="scale(1) translate(4 229.76)"><title>wallet-model</title><g id="clust1" class="cluster oh-cluster"><title>cluster_visible</title><path d="m623.86-28.76h170.93c6 0 12-6 12-12v-100c0-6-6-12-12-12h-170.93c-6 0-12 6-12 12v100c0 6 6 12 12 12" fill="none" stroke="black"/><text x="709.33" y="-137.36" font-family="Inter, sans-serif" font-size="12" text-anchor="middle" xml:space="preserve">What the user sees</text></g><g id="clust2" class="cluster oh-cluster"><title>cluster_hidden</title><path d="m20-24.76h466.36c6 0 12-6 12-12v-169c0-6-6-12-12-12h-466.36c-6 0-12 6-12 12v169c0 6 6 12 12 12" fill="none" stroke="black"/><text x="253.18" y="-202.36" font-family="Inter, sans-serif" font-size="12" text-anchor="middle" xml:space="preserve">Managed by OFFER-HUB</text></g><g id="node1" class="node oh-node"><title>balance</title><path d="m778.79-114.59h-138.93c-6 0-12 6-12 12v45.66c0 6 6 12 12 12h138.93c6 0 12-6 12-12v-45.66c0-6-6-12-12-12" fill="white" stroke="black"/><text x="709.33" y="-92.16" font-family="Inter, sans-serif" font-size="13" text-anchor="middle" xml:space="preserve">Balance</text><text x="709.33" y="-75.66" font-family="Inter, sans-serif" font-size="13" text-anchor="middle" xml:space="preserve">available / reserved</text><text x="709.33" y="-59.16" font-family="Inter, sans-serif" font-size="13" text-anchor="middle" xml:space="preserve">(USD)</text></g><g id="node2" class="node oh-node"><title>wallet</title><path d="m177.93-110.59h-141.93c-6 0-12 6-12 12v45.66c0 6 6 12 12 12h141.93c6 0 12-6 12-12v-45.66c0-6-6-12-12-12" fill="white" stroke="black"/><text x="106.97" y="-88.16" font-family="Inter, sans-serif" font-size="13" text-anchor="middle" xml:space="preserve">Wallet record</text><text x="106.97" y="-71.66" font-family="Inter, sans-serif" font-size="13" text-anchor="middle" xml:space="preserve">INVISIBLE / STELLAR</text><text x="106.97" y="-55.16" font-family="Inter, sans-serif" font-size="13" text-anchor="middle" xm