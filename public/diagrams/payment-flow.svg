<?xml version="1.0" encoding="UTF-8"?>
<!-- OFFER-HUB — Payment & Escrow Lifecycle
     Generated by scripts/diagrams/payment-flow.py via the offline SVG pipeline.
     Regenerate: npm run diagrams
     Source:     docs/architecture/payment-flows.md, docs/guides/core-concepts.md
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 520" role="img" aria-labelledby="payment-flow-title payment-flow-desc">
  <title id="payment-flow-title">OFFER-HUB Payment &amp; Escrow Lifecycle</title>
  <desc id="payment-flow-desc">
    End-to-end payment flow: Buyer deposits USDC, funds are reserved, an escrow
    contract is deployed on Stellar via Trustless Work, the contract is funded
    on-chain, funds are released after work approval, and the freelancer receives
    their payout. A dispute branch routes through arbitration before resolving
    to release or refund.
  </desc>

  <defs>
    <style>
      /* ── Light-mode defaults ────────────────────────────────────────────── */
      :root {
        --color-bg-base:        #F1F3F7;
        --color-bg-elevated:    #ffffff;
        --color-bg-sunken:      #e8eaef;
        --color-text-primary:   #19213D;
        --color-text-secondary: #6D758F;
        --color-primary:        #149A9B;
        --color-primary-hover:  #0d7377;
        --color-accent:         #15949C;
        --color-success:        #16a34a;
        --color-warning:        #d97706;
        --color-error:          #FF0000;
        --color-border:         #d1d5db;
        --shadow-dark:          #d1d5db;
        --shadow-light:         #ffffff;
      }
      /* ── Dark-mode (media query) ────────────────────────────────────────── */
      @media (prefers-color-scheme: dark) {
        :root {
          --color-bg-base:        #242433;
          --color-bg-elevated:    #2e2e3f;
          --color-bg-sunken:      #1a1a26;
          --color-text-primary:   #f1f3f7;
          --color-text-secondary: #b8bfd0;
          --color-primary:        #1fb8b9;
          --color-primary-hover:  #25d4d5;
          --color-border:         #3d3d5c;
          --shadow-dark:          #1a1a26;
          --shadow-light:         #2e2e3f;
        }
      }
      /* ── Dark-mode (class-based, ThemeProvider) ─────────────────────────── */
      .dark {
        --color-bg-base:        #242433;
        --color-bg-elevated:    #2e2e3f;
        --color-bg-sunken:      #1a1a26;
        --color-text-primary:   #f1f3f7;
        --color-text-secondary: #b8bfd0;
        --color-primary:        #1fb8b9;
        --color-primary-hover:  #25d4d5;
        --color-border:         #3d3d5c;
        --shadow-dark:          #1a1a26;
        --shadow-light:         #2e2e3f;
      }

      svg { background: var(--color-bg-base); font-family: Inter, Roboto, Outfit, sans-serif; }

      .diagram-bg    { fill: var(--color-bg-base); }
      .cluster-fill  { fill: var(--color-bg-sunken); stroke: var(--color-border); }
      .node-fill     { fill: var(--color-bg-elevated); stroke: var(--color-primary); }
      .node-accent   { fill: var(--color-bg-elevated); stroke: var(--color-accent); }
      .node-success  { fill: var(--color-bg-elevated); stroke: var(--color-success); }
      .node-warning  { fill: var(--color-bg-elevated); stroke: var(--color-warning); }
      .node-stellar  { fill: var(--color-bg-elevated); stroke: var(--color-accent); }
      .actor-fill    { fill: var(--color-bg-elevated); stroke: var(--color-primary); }

      .label-primary   { fill: var(--color-text-primary);   font-size: 12px; font-weight: 600; }
      .label-secondary { fill: var(--color-text-secondary); font-size: 10px; }
      .label-section   { fill: var(--color-text-secondary); font-size: 10px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; }
      .label-title     { fill: var(--color-text-primary);   font-size: 15px; font-weight: 800; letter-spacing: 0.02em; }
      .label-success   { fill: var(--color-success); font-size: 11px; font-weight: 600; }
      .label-warning   { fill: var(--color-warning); font-size: 11px; font-weight: 600; }

      .edge            { fill: none; stroke: var(--color-text-secondary); stroke-width: 1.5; }
      .edge-accent     { fill: none; stroke: var(--color-accent);         stroke-width: 1.5; }
      .edge-success    { fill: none; stroke: var(--color-success);        stroke-width: 1.5; stroke-dasharray: 5,3; }
      .edge-warning    { fill: none; stroke: var(--color-warning);        stroke-width: 1.5; stroke-dasharray: 5,3; }
      .edge-error      { fill: none; stroke: var(--color-error);          stroke-width: 1.5; stroke-dasharray: 5,3; }
      .edge-dashed     { fill: none; stroke: var(--color-text-secondary); stroke-width: 1.5; stroke-dasharray: 5,3; }

      .arrowhead { fill: var(--color-text-secondary); }
      .arrowhead-success { fill: var(--color-success); }
      .arrowhead-warning { fill: var(--color-warning); }
      .arrowhead-error   { fill: var(--color-error); }
      .arrowhead-accent  { fill: var(--color-accent); }
    </style>

    <!-- Arrowhead markers -->
    <marker id="arrow"         markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" class="arrowhead"/>
    </marker>
    <marker id="arrow-success" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" class="arrowhead-success"/>
    </marker>
    <marker id="arrow-warning" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" class="arrowhead-warning"/>
    </marker>
    <marker id="arrow-error"   markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" class="arrowhead-error"/>
    </marker>
    <marker id="arrow-accent"  markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" class="arrowhead-accent"/>
    </marker>
  </defs>

  <!-- Canvas background -->
  <rect width="920" height="520" class="diagram-bg" rx="16"/>

  <!-- ── Title ──────────────────────────────────────────────────────────── -->
  <text x="460" y="36" text-anchor="middle" class="label-title">OFFER-HUB — Payment &amp; Escrow Lifecycle</text>

  <!-- ══════════════════════════════════════════════════════════════════════
       Cluster: Actors
       ══════════════════════════════════════════════════════════════════════ -->
  <rect x="20" y="55" width="140" height="400" rx="14" class="cluster-fill" stroke-width="1"/>
  <text x="90" y="74" text-anchor="middle" class="label-section">Actors</text>

  <!-- Buyer node -->
  <ellipse cx="90" cy="130" rx="52" ry="28" class="actor-fill" stroke-width="1.5"/>
  <text x="90" y="126" text-anchor="middle" class="label-primary">🧑‍💼 Buyer</text>
  <text x="90" y="141" text-anchor="middle" class="label-secondary">(marketplace client)</text>

  <!-- Freelancer node -->
  <ellipse cx="90" cy="370" rx="52" ry="28" class="actor-fill" stroke-width="1.5"/>
  <text x="90" y="366" text-anchor="middle" class="label-primary">💻 Freelancer</text>
  <text x="90" y="381" text-anchor="middle" class="label-secondary">(service provider)</text>

  <!-- ══════════════════════════════════════════════════════════════════════
       Cluster: Orchestrator states
       ══════════════════════════════════════════════════════════════════════ -->
  <rect x="175" y="55" width="560" height="310" rx="14" class="cluster-fill" stroke-width="1" stroke="var(--color-primary)"/>
  <text x="455" y="74" text-anchor="middle" class="label-section">OFFER-HUB Orchestrator</text>

  <!-- Top-up -->
  <rect x="200" y="104" width="96" height="46" rx="10" class="node-fill" stroke-width="1.5"/>
  <text x="248" y="124" text-anchor="middle" class="label-primary">Top-up</text>
  <text x="248" y="140" text-anchor="middle" class="label-secondary">(Airtm)</text>

  <!-- Reserve -->
  <rect x="330" y="104" width="96" height="46" rx="10" class="node-fill" stroke-width="1.5"/>
  <text x="378" y="124" text-anchor="middle" class="label-primary">Funds</text>
  <text x="378" y="140" text-anchor="middle" class="label-secondary">Reserved</text>

  <!-- Creating -->
  <rect x="460" y="104" width="96" height="46" rx="10" class="node-accent" stroke-width="1.5"/>
  <text x="508" y="124" text-anchor="middle" class="label-primary">Escrow</text>
  <text x="508" y="140" text-anchor="middle" class="label-secondary">Creating</text>

  <!-- Funded -->
  <rect x="590" y="104" width="96" height="46" rx="10" class="node-accent" stroke-width="1.5"/>
  <text x="638" y="124" text-anchor="middle" class="label-primary">Escrow</text>
  <text x="638" y="140" text-anchor="middle" class="label-secondary">Funded</text>

  <!-- Release -->
  <rect x="460" y="234" width="96" height="46" rx="10" class="node-success" stroke-width="1.5"/>
  <text x="508" y="254" text-anchor="middle" class="label-primary">Funds</text>
  <text x="508" y="270" text-anchor="middle" class="label-secondary">Released</text>

  <!-- Withdraw -->
  <rect x="330" y="234" width="96" height="46" rx="10" class="node-success" stroke-width="1.5"/>
  <text x="378" y="254" text-anchor="middle" class="label-primary">Withdrawal</text>
  <text x="378" y="270" text-anchor="middle" class="label-secondary">(Airtm)</text>

  <!-- Dispute diamond -->
  <polygon points="638,210 668,257 638,304 608,257" class="node-warning" stroke-width="1.5"/>
  <text x="638" y="253" text-anchor="middle" class="label-warning">Dispute</text>
  <text x="638" y="268" text-anchor="middle" class="label-secondary" style="font-size:9px">Arbitration</text>

  <!-- ══════════════════════════════════════════════════════════════════════
       Cluster: Stellar / Trustless Work
       ══════════════════════════════════════════════════════════════════════ -->
  <rect x="750" y="55" width="148" height="180" rx="14" class="cluster-fill" stroke-width="1" stroke="var(--color-accent)"/>
  <text x="824" y="74" text-anchor="middle" class="label-section">Stellar · Trustless Work</text>

  <!-- Soroban contract (hexagon approximated with polygon) -->
  <polygon points="824,98 862,118 862,158 824,178 786,158 786,118" class="node-stellar" stroke-width="1.5"/>
  <text x="824" y="133" text-anchor="middle" class="label-primary" style="font-size:11px">Soroban</text>
  <text x="824" y="148" text-anchor="middle" class="label-primary" style="font-size:11px">Escrow</text>
  <text x="824" y="163" text-anchor="middle" class="label-secondary" style="font-size:9px">Contract</text>

  <!-- ══════════════════════════════════════════════════════════════════════
       Edges — happy path
       ══════════════════════════════════════════════════════════════════════ -->

  <!-- 1. Buyer → TopUp -->
  <path d="M142,130 L200,127" class="edge" marker-end="url(#arrow)"/>
  <text x="171" y="122" text-anchor="middle" class="label-secondary">1. Deposit USDC</text>

  <!-- 2. TopUp → Reserve -->
  <path d="M296,127 L330,127" class="edge" marker-end="url(#arrow)"/>
  <text x="313" y="122" text-anchor="middle" class="label-secondary">2. Reserved</text>

  <!-- 3. Reserve → Creating -->
  <path d="M426,127 L460,127" class="edge" marker-end="url(#arrow)"/>
  <text x="443" y="122" text-anchor="middle" class="label-secondary">3. Order</text>

  <!-- 4. Creating → Stellar Contract -->
  <path d="M556,127 L786,138" class="edge-accent" marker-end="url(#arrow-accent)"/>
  <text x="671" y="122" text-anchor="middle" class="label-secondary">4. Deploy contract</text>

  <!-- 5. Contract → Funded -->
  <path d="M786,148 L686,140" class="edge-accent" marker-end="url(#arrow-accent)"/>
  <text x="736" y="160" text-anchor="middle" class="label-secondary">5. On-chain funded</text>

  <!-- 6. Funded → Release (approve) -->
  <path d="M638,150 L538,234" class="edge" marker-end="url(#arrow)"/>
  <text x="610" y="200" text-anchor="middle" class="label-secondary">6. Approve</text>

  <!-- 7. Release → Contract (on-chain release) -->
  <path d="M556,250 L786,168" class="edge-dashed" marker-end="url(#arrow)"/>
  <text x="680" y="222" text-anchor="middle" class="label-secondary">7. On-chain release</text>

  <!-- 8. Release → Withdraw -->
  <path d="M460,257 L426,257" class="edge" marker-end="url(#arrow)"/>
  <text x="443" y="250" text-anchor="middle" class="label-secondary">8. Payout</text>

  <!-- 9. Withdraw → Freelancer -->
  <path d="M330,264 L200,370" class="edge" marker-end="url(#arrow)"/>
  <text x="265" y="305" text-anchor="middle" class="label-secondary">9. USDC arrives</text>

  <!-- ══════════════════════════════════════════════════════════════════════
       Edges — dispute branch
       ══════════════════════════════════════════════════════════════════════ -->

  <!-- Funded → Dispute -->
  <path d="M638,150 L638,210" class="edge-warning" marker-end="url(#arrow-warning)"/>
  <text x="660" y="185" text-anchor="start" class="label-warning">dispute raised</text>

  <!-- Dispute → Release (resolved) -->
  <path d="M610,257 L556,257" class="edge-success" marker-end="url(#arrow-success)"/>
  <text x="583" y="274" text-anchor="middle" class="label-success">resolved → release</text>

  <!-- Dispute → Reserve (refund) -->
  <path d="M608,245 L426,150" class="edge-error" marker-end="url(#arrow-error)"/>
  <text x="528" y="196" text-anchor="middle" class="label-secondary" style="fill:var(--color-error);font-size:10px">resolved → refund</text>

  <!-- ══════════════════════════════════════════════════════════════════════
       Legend
       ══════════════════════════════════════════════════════════════════════ -->
  <g transform="translate(20, 476)">
    <text x="0" y="14" class="label-section">Legend:</text>
    <line x1="65"  y1="9"  x2="90"  y2="9"  class="edge" marker-end="url(#arrow)"/>
    <text x="95"  y="14" class="label-secondary">Happy path</text>
    <line x1="175" y1="9"  x2="200" y2="9"  class="edge-dashed" marker-end="url(#arrow)"/>
    <text x="205" y="14" class="label-secondary">On-chain call</text>
    <line x1="305" y1="9"  x2="330" y2="9"  class="edge-warning" marker-end="url(#arrow-warning)"/>
    <text x="335" y="14" class="label-secondary">Dispute path</text>
    <line x1="430" y1="9"  x2="455" y2="9"  class="edge-success" marker-end="url(#arrow-success)"/>
    <text x="460" y="14" class="label-secondary">Resolution</text>
  </g>
</svg>
