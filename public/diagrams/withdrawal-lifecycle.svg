<!DOCTYPE svg  PUBLIC '-//W3C//DTD SVG 1.1//EN'  'http://www.w3.org/Graphics/SVG/1.1/DTD/svg11.dtd'>
<svg width="896pt" height="633pt" viewBox="0 0 896 633" xmlns="http://www.w3.org/2000/svg"><style>.oh-node path, .oh-node polygon, .oh-node ellipse {
  fill: var(--color-bg-elevated);
  stroke: var(--color-border);
  stroke-width: 1.5px;
  filter: drop-shadow(3px 3px 4px var(--shadow-dark)) drop-shadow(-2px -2px 4px var(--shadow-light));
}
.oh-node text {
  fill: var(--color-text-primary);
  font-family: var(--font-inter), Inter, sans-serif;
}
.oh-node--terminal ellipse {
  fill: var(--color-primary);
  stroke: var(--color-primary);
  filter: none;
}
.oh-edge path {
  stroke: var(--color-text-secondary);
  fill: none;
}
.oh-edge polygon {
  fill: var(--color-text-secondary);
  stroke: var(--color-text-secondary);
}
.oh-edge--alt path {
  stroke-dasharray: 5 4;
}
.oh-edge--alt polygon {
  stroke-dasharray: none;
}
.oh-cluster path, .oh-cluster polygon {
  fill: none;
  stroke: var(--color-border);
  stroke-width: 1.5px;
  stroke-dasharray: 6 4;
}
.oh-cluster text {
  fill: var(--color-text-secondary);
  font-family: var(--font-inter), Inter, sans-serif;
  font-weight: 600;
}
.oh-edge text {
  fill: var(--color-text-secondary);
  font-family: var(--font-inter), Inter, sans-serif;
}</style><g id="graph0" class="graph" transform="scale(1) translate(4 629)"><title>withdrawal-lifecycle</title><g id="node1" class="node oh-node oh-node--terminal"><title>start</title><ellipse cx="486" cy="-619" rx="6" ry="6" fill="black" stroke="black"/></g><g id="node2" class="node oh-node"><title>WITHDRAWAL_CREATED</title><path d="m535-557h-98c-6 0-12 6-12 12v24c0 6 6 12 12 12h98c6 0 12-6 12-12v-24c0-6-6-12-12-12" fill="white" stroke="black"/><text x="486" y="-536.6" font-family="Inter, sans-serif" font-size="13" text-anchor="middle">WITHDRAWAL</text><text x="486" y="-522.6" font-family="Inter, sans-serif" font-size="13" text-anchor="middle">CREATED</text></g><g id="edge1" class="edge oh-edge"><title>start-&gt;WITHDRAWAL_CREATED</title><path d="m486-613v45.41" fill="none" stroke="black"/><polygon points="489.5 -567.2 486 -557.2 482.5 -567.2" fill="black" stroke="black"/><text x="537.5" y="-582.2" font-family="Inter, sans-serif" font-size="11" text-anchor="middle">POST /withdrawals</text></g><g id="node3" class="node oh-node"><title>WITHDRAWAL_COMMITTED</title><path d="m402-453h-98c-6 0-12 6-12 12v24c0 6 6 12 12 12h98c6 0 12-6 12-12v-24c0-6-6-12-12-12" fill="white" stroke="black"/><text x="353" y="-432.6" font-family="Inter, sans-serif" font-size="13" text-anchor="middle">WITHDRAWAL</text><text x="353" y="-418.6" font-family="Inter, sans-serif" font-size="13" text-anchor="middle">COMMITTED</text></g><g id="edge2" class="edge oh-edge"><title>WITHDRAWAL_CREATED-&gt;WITHDRAWAL_COMMITTED</title><path d="m435.68-508.94c-11.59 6.34-23.49 13.76-33.68 21.94-9.37 7.52-18.33 17-25.97 26.06" fill="none" stroke="black"/><polygon points="378.7 -458.69 369.67 -453.15 373.28 -463.11" fill="black" stroke="black"/><text x="489.5" y="-478.2" font-family="Inter, sans-serif" font-size="11" text-anchor="middle">POST /withdrawals/{id}/commit</text></g><g id="node6" class="node oh-node"><title>WITHDRAWAL_COMPLETED</title><path d="m638-209h-98c-6 0-12 6-12 12v24c0 6 6 12 12 12h98c6 0 12-