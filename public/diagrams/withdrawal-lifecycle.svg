<!DOCTYPE svg  PUBLIC '-//W3C//DTD SVG 1.1//EN'  'http://www.w3.org/Graphics/SVG/1.1/DTD/svg11.dtd'>
<svg width="879pt" height="669pt" viewBox="0 0 879 669" xmlns="http://www.w3.org/2000/svg"><style>.oh-node path, .oh-node polygon, .oh-node ellipse {
  fill: var(--color-bg-elevated);
  stroke: var(--color-border);
  stroke-width: 1.5px;
  filter: drop-shadow(3px 3px 4px var(--shadow-dark)) drop-shadow(-2px -2px 4px var(--shadow-light));
}
.oh-node text {
  fill: var(--color-text-primary);
  font-family: var(--font-inter), Inter, sans-serif;
}
.oh-node--terminal ellipse {
  fill: var(--color-primary);
  stroke: var(--color-primary);
  filter: none;
}
.oh-edge path {
  stroke: var(--color-text-secondary);
  fill: none;
}
.oh-edge polygon {
  fill: var(--color-text-secondary);
  stroke: var(--color-text-secondary);
}
.oh-edge--alt path {
  stroke-dasharray: 5 4;
}
.oh-edge--alt polygon {
  stroke-dasharray: none;
}
.oh-cluster path, .oh-cluster polygon {
  fill: none;
  stroke: var(--color-border);
  stroke-width: 1.5px;
  stroke-dasharray: 6 4;
}
.oh-cluster text {
  fill: var(--color-text-secondary);
  font-family: var(--font-inter), Inter, sans-serif;
  font-weight: 600;
}
.oh-edge text {
  fill: var(--color-text-secondary);
  font-family: var(--font-inter), Inter, sans-serif;
}</style><g id="graph0" class="graph" transform="scale(1) translate(4 665)"><title>withdrawal-lifecycle</title><g id="node1" class="node oh-node oh-node--terminal"><title>start</title><ellipse cx="466" cy="-655.24" rx="5.76" ry="5.76" fill="black" stroke="black"/></g><g id="node2" class="node oh-node"><title>WITHDRAWAL_CREATED</title><path d="m514.47-591.98h-96.94c-6 0-12 6-12 12v29.16c0 6 6 12 12 12h96.94c6 0 12-6 12-12v-29.16c0-6-6-12-12-12" fill="white" stroke="black"/><text x="466" y="-569.55" font-family="Inter, sans-serif" font-size="13" text-anchor="middle" xml:space="preserve">WITHDRAWAL</text><text x="466" y="-553.05" font-family="Inter, sans-serif" font-size="13" text-anchor="middle" xml:space="preserve">CREATED</text></g><g id="edge1" class="edge oh-edge"><title>start-&gt;WITHDRAWAL_CREATED</title><path d="m466-649.01v45.3" fill="none" stroke="black"/><polygon points="469.5 -603.78 466 -593.78 462.5 -603.78" fill="black" stroke="black"/><text x="517.38" y="-617.03" font-family="Inter, sans-serif" font-size="11" text-anchor="middle" xml:space="preserve">POST /withdrawals</text></g><g id="node3" class="node oh-node"><title>WITHDRAWAL_COMMITTED</title><path d="m405.47-481.32h-96.94c-6 0-12 6-12 12v29.16c0 6 6 12 12 12h96.94c6 0 12-6 12-12v-29.16c0-6-6-12-12-12" fill="white" stroke="black"/><text x="357" y="-458.89" font-family="Inter, sans-serif" font-size="13" text-anchor="middle" xml:space="preserve">WITHDRAWAL</text><text x="357" y="-442.39" font-family="Inter, sans-serif" font-size="13" text-anchor="middle" xml:space="preserve">COMMITTED</text></g><g id="edge2" class="edge oh-edge"><title>WITHDRAWAL_CREATED-&gt;WITHDRAWAL_COMMITTED</title><path d="m413.68-538.58c-9.54 6.24-18.86 13.53-26.43 21.76-6.55 7.12-12 15.92-16.39 24.61" fill="none" stroke="black"/><polygon points="374.05 -490.78 366.67 -483.17 367.7 -493.72" fill="black" stroke="black"/><text x="474.62" y="-506.37" font-family="Inter, sans-serif" font-size="11" text-anchor="middle" xml:space="pre