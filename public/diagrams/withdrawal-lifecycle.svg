<!DOCTYPE svg  PUBLIC '-//W3C//DTD SVG 1.1//EN'  'http://www.w3.org/Graphics/SVG/1.1/DTD/svg11.dtd'>
<svg width="455pt" height="285pt" viewBox="0 0 455 285" xmlns="http://www.w3.org/2000/svg"><style>.oh-node path, .oh-node polygon, .oh-node ellipse {
  fill: var(--color-bg-elevated);
  stroke: var(--color-border);
  stroke-width: 1.5px;
  filter: drop-shadow(3px 3px 4px var(--shadow-dark)) drop-shadow(-2px -2px 4px var(--shadow-light));
}
.oh-node text {
  fill: var(--color-text-primary);
  font-family: var(--font-inter), Inter, sans-serif;
}
.oh-node--terminal ellipse {
  fill: var(--color-primary);
  stroke: var(--color-primary);
  filter: none;
}
.oh-edge path {
  stroke: var(--color-text-secondary);
  fill: none;
}
.oh-edge polygon {
  fill: var(--color-text-secondary);
  stroke: var(--color-text-secondary);
}
.oh-edge--alt path {
  stroke-dasharray: 5 4;
}
.oh-edge--alt polygon {
  stroke-dasharray: none;
}
.oh-cluster path, .oh-cluster polygon {
  fill: none;
  stroke: var(--color-border);
  stroke-width: 1.5px;
  stroke-dasharray: 6 4;
}
.oh-cluster text {
  fill: var(--color-text-secondary);
  font-family: var(--font-inter), Inter, sans-serif;
  font-weight: 600;
}
.oh-edge text {
  fill: var(--color-text-secondary);
  font-family: var(--font-inter), Inter, sans-serif;
}</style><g id="graph0" class="graph" transform="scale(1) translate(4 281)"><title>withdrawal-lifecycle</title><g id="node1" class="node oh-node oh-node--terminal"><title>start</title><ellipse cx="149" cy="-271" rx="6" ry="6" fill="black" stroke="black"/></g><g id="node2" class="node oh-node"><title>WITHDRAWAL_CREATED</title><path d="m198-209h-98c-6 0-12 6-12 12v24c0 6 6 12 12 12h98c6 0 12-6 12-12v-24c0-6-6-12-12-12" fill="white" stroke="black"/><text x="149" y="-188.6" font-family="Inter, sans-serif" font-size="13" text-anchor="middle">WITHDRAWAL</text><text x="149" y="-174.6" font-family="Inter, sans-serif" font-size="13" text-anchor="middle">CREATED</text></g><g id="edge1" class="edge oh-edge"><title>start-&gt;WITHDRAWAL_CREATED</title><path d="m149-265v45.41" fill="none" stroke="black"/><polygon points="152.5 -219.2 149 -209.2 145.5 -219.2" fill="black" stroke="black"/><text x="200.5" y="-234.2" font-family="Inter, sans-serif" font-size="11" text-anchor="middle">POST /withdrawals</text></g><g id="node3" class="node oh-node"><title>WITHDRAWAL_COMPLETED</title><path d="m110-105h-98c-6 0-12 6-12 12v24c0 6 6 12 12 12h98c6 0 12-6 12-12v-24c0-6-6-12-12-12" fill="white" stroke="black"/><text x="61" y="-84.6" font-family="Inter, sans-serif" font-size="13" text-anchor="middle">WITHDRAWAL</text><text x="61" y="-70.6" font-family="Inter, sans-serif" font-size="13" text-anchor="middle">COMPLETED</text></g><g id="edge2" class="edge oh-edge oh-edge--alt"><title>WITHDRAWAL_CREATED-&gt;WITHDRAWAL_COMPLETED</title><path d="m87.85-171.23c-17.06 6.68-33.7 16.83-43.85 32.23-4.78 7.25-4.59 15.89-2.17 24.22" fill="none" stroke="black"/><polygon points="45.18 -115.83 45.52 -105.24 38.65 -113.31" fill="black" stroke="black"/><text x="123.5" y="-130.2" font-family="Inter, sans-serif" font-size="11" text-anchor="middle">crypto: Stellar payment sent</text></g><g id="node4" class="node oh-node"><title>WITHDRAWAL_FAILED</title><path d="m285-105h-98c-6 0-12 6-12 12v24c0 6 6 12 12 12h98c6 0 12-6 12-12v-24c0-6-6-12-12-12" fill="white" stroke="black"/><text x="236" y="-84.6" font-family="Inter, sans-serif" font-size="13" text-anchor="middle">WITHDRAWAL</text><text x="236" y="-70.6" font-family="Inter, sans-serif" font-size="13" text-anchor="middle">FAILED</text></g><g id="edge3" class="edge oh-edge oh-edge--alt"><title>WITHDRAWAL_CREATED-&gt;WITHDRAWAL_FAILED</title><path d="m187.48-160.95c8.5 6.35 16.93 13.77 23.52 21.95 5.81 7.21 10.54 15.99 14.25 24.47" fill="none" stroke="black"/><polygon points="228.52 -115.76 229.01 -105.18 222.03 -113.15" fill="black" stroke="black"/><text x="332.5" y="-130.2" font-family="Inter, sans-serif" font-size="11" text-anchor="middle">crypto: payment error (balance restored)</text></g><g id="node5" class="node oh-node oh-node--terminal"><title>end</title><ellipse cx="148" cy="-6" rx="6" ry="6" fill="black" stroke="black"/></g><g id="edge4" class="edge oh-edge"><title>WITHDRAWAL_COMPLETED-&gt;end</title><path d="m88.53-56.9c16.02 13.45 35.41 29.71 47.59 39.93" fill="none" stroke="black"/><polygon points="138.45 -19.58 143.86 -10.47 133.95 -14.22" fill="black" stroke="black"/></g><g id="edge5" class="edge oh-edge"><title>WITHDRAWAL_FAILED-&gt;end</title><path d="m208.16-56.9c-16.21 13.45-35.82 29.71-48.15 39.93" fill="none" stroke="black"/><polygon points="162.12 -14.16 152.19 -10.47 157.65 -19.55" fill="black" stroke="black"/></g></g></svg>
