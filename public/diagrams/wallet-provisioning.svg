<!DOCTYPE svg  PUBLIC '-//W3C//DTD SVG 1.1//EN'  'http://www.w3.org/Graphics/SVG/1.1/DTD/svg11.dtd'>
<svg width="487pt" height="947pt" viewBox="0 0 487 947" xmlns="http://www.w3.org/2000/svg"><style>.oh-node path, .oh-node polygon, .oh-node ellipse {
  fill: var(--color-bg-elevated);
  stroke: var(--color-border);
  stroke-width: 1.5px;
  filter: drop-shadow(3px 3px 4px var(--shadow-dark)) drop-shadow(-2px -2px 4px var(--shadow-light));
}
.oh-node text {
  fill: var(--color-text-primary);
  font-family: var(--font-inter), Inter, sans-serif;
}
.oh-node--terminal ellipse {
  fill: var(--color-primary);
  stroke: var(--color-primary);
  filter: none;
}
.oh-edge path {
  stroke: var(--color-text-secondary);
  fill: none;
}
.oh-edge polygon {
  fill: var(--color-text-secondary);
  stroke: var(--color-text-secondary);
}
.oh-edge--alt path {
  stroke-dasharray: 5 4;
}
.oh-edge--alt polygon {
  stroke-dasharray: none;
}
.oh-cluster path, .oh-cluster polygon {
  fill: none;
  stroke: var(--color-border);
  stroke-width: 1.5px;
  stroke-dasharray: 6 4;
}
.oh-cluster text {
  fill: var(--color-text-secondary);
  font-family: var(--font-inter), Inter, sans-serif;
  font-weight: 600;
}
.oh-edge text {
  fill: var(--color-text-secondary);
  font-family: var(--font-inter), Inter, sans-serif;
